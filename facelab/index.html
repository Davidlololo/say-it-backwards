<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<title>Face Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: camera fills the screen; a filter strip and shutter sit in a dark dock at the bottom. */
:root{
  --bg:#0a0a0b; --ink:#f5f4f0; --muted:#a3a19b; --accent:#d9ff3f; --rec:#ff3b3b; --glass:rgba(14,14,16,.6); --line:rgba(255,255,255,.12);
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:600;overflow:hidden;user-select:none;-webkit-user-select:none}
button,a{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
#out{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;touch-action:none}
video#v{display:none}

#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  background:radial-gradient(90% 60% at 80% 20%,#2a3310 0%,transparent 60%),var(--bg)}
#start h1{font-size:clamp(64px,21vw,104px);line-height:.85;margin:0;font-weight:800;letter-spacing:-.04em}
#start h1 em{font-style:normal;color:var(--accent)}
#start p{margin:0;color:var(--muted);font-size:17px;line-height:1.4;max-width:30ch}
.list{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.list span{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;color:#d6d4ce}
.go{background:var(--accent);color:#111;font-size:19px;font-weight:800;padding:18px;border-radius:18px}
#status{min-height:1.3em;color:var(--muted);font-size:14px;margin:0}
#status.err{color:#ff8a8a}

.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;text-shadow:0 1px 8px #0008}
.brand em{font-style:normal;color:var(--accent)}
.ic{width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
.pill{position:fixed;top:max(66px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);z-index:3;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
.pill.rec{background:var(--rec)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:26px 0 max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.8) 35%)}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px max(16px,env(safe-area-inset-left)) 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.fl{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
.fl .dot{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--glass);border:2px solid var(--line);transition:transform .15s,border-color .15s}
.fl span{font-size:12px;color:var(--muted);white-space:nowrap}
.fl[aria-pressed="true"] .dot{border-color:var(--accent);transform:scale(1.1)}
.fl[aria-pressed="true"] span{color:var(--ink)}
.shut{display:flex;justify-content:center;align-items:center;gap:40px;margin-top:6px}
.recbtn{width:76px;height:76px;border-radius:50%;border:5px solid #fff;display:grid;place-items:center;position:relative}
.recbtn i{width:56px;height:56px;border-radius:50%;background:var(--rec);transition:all .2s}
.recbtn.on i{width:26px;height:26px;border-radius:7px}
.recbtn svg{position:absolute;inset:-5px;transform:rotate(-90deg)}
.recbtn circle{fill:none;stroke:var(--accent);stroke-width:5;stroke-dasharray:264;stroke-dashoffset:264}
.side{width:48px;height:48px}

#result{position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#result video,#result img{max-width:100%;max-height:64vh;border-radius:18px;background:#000}
.acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.btn{padding:15px;border-radius:16px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;display:block}
.b1{background:var(--accent);color:#111}.b2{background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="out"></canvas>

<section id="start">
  <h1>Face<br><em>Lab</em></h1>
  <p>Realistic filters painted onto your real face and hair. Hold the screen to see the before.</p>
  <div class="list"><span>💈 Buzzcut</span><span>👱 Blonde</span><span>🩷 Pink hair</span><span>🧔 Beard</span><span>💀 Skull paint</span><span>🧟 Zombie</span><span>🧛 Vampire</span><span>🇷🇴 Flag paint</span></div>
  <button class="go" id="goBtn">Turn on camera</button>
  <p id="status"></p>
</section>

<div class="top" id="top" hidden>
  <span class="brand">Face <em>Lab</em></span>
  <button class="ic" id="flipBtn" aria-label="Flip camera">🔄</button>
</div>
<div class="pill" id="pill" hidden></div>

<div class="dock" id="dock" hidden>
  <div class="strip" id="strip"></div>
  <div class="shut">
    <button class="ic side" id="photoBtn" aria-label="Take photo">📷</button>
    <button class="recbtn" id="recBtn" aria-label="Record video"><svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="42" id="recRing"/></svg><i></i></button>
    <button class="ic side" id="beforeBtn" aria-label="Show before">👁️</button>
  </div>
</div>

<section id="result" hidden>
  <video id="clip" playsinline controls loop></video>
  <img id="shot" alt="Your photo" hidden>
  <div class="acts">
    <button class="btn b1" id="shareBtn">Share</button>
    <a class="btn b2" id="saveBtn" download="face-lab.mp4">Save</a>
    <button class="btn b2" id="againBtn">Back to camera</button>
  </div>
</section>

const VS_MESH=`#version 300 es

const COMMON=`#version 300 es

uniform sampler2D uVideo, uHair, uFill; uniform float uMirror; uniform vec2 uRes;
uniform int uHairMode; uniform vec3 uHairCol; uniform vec2 uLift; uniform vec4 uScalp; uniform float uScalpRot; uniform vec3 uSkin;
uniform vec4 uIris[2]; uniform vec3 uIrisCol;

  if(uHairMode==2){ float h=texture(uHair,t).r;
    vec2 d=px-uScalp.xy; float cs=cos(-uScalpRot), sn=sin(-uScalpRot); d=vec2(d.x*cs-d.y*sn, d.x*sn+d.y*cs)/uScalp.zw;

const FS_FULL=COMMON+`in vec2 s; uniform int uRaw; out vec4 o; void main(){ vec2 t=vid(s); vec3 v=texture(uVideo,t).rgb; if(uRaw==0) v=effects(v,t); o=vec4(v,1); }`;

    for(let j=0;j<nw*nh;j++){ const s=a[j]; if(s>0){ c[j*3]/=s; c[j*3+1]/=s; c[j*3+2]/=s; } a[j]=Math.min(1,s); }

      const fx=Math.min(q.w-1,Math.max(0,(x-.5)/2)), fy=Math.min(q.h-1,Math.max(0,(y-.5)/2)), x0=fx|0, y0=fy|0, x1=Math.min(q.w-1,x0+1), y1=Math.min(q.h-1,y0+1), tx=fx-x0, ty=fy-y0;

    if(bg){
      sx.drawImage(V,0,0,FW,FH); const px=sx.getImageData(0,0,FW,FH).data, rgb=new Float32Array(FW*FH*3);
      for(let i=0;i<FW*FH;i++){ rgb[i*3]=px[i*4]; rgb[i*3+1]=px[i*4+1]; rgb[i*3+2]=px[i*4+2]; }
      const f=pushPull(rgb,bg,FW,FH); for(let i=0;i<FW*FH;i++){ fillPix[i*4]=f[i*3]; fillPix[i*4+1]=f[i*3+1]; fillPix[i*4+2]=f[i*3+2]; fillPix[i*4+3]=255; }
      gl.bindTexture(gl.TEXTURE_2D,tFill); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FW,FH,0,gl.RGBA,gl.UNSIGNED_BYTE,fillPix);
      if(sm){ sx.drawImage(V,0,0,SW,SH); const im=sx.getImageData(0,0,SW,SH).data; let r0=0,g0=0,b0=0,n=0;
        for(const i of [151,9,108,337,50,280]){ const cx=sm[i].x*SW|0, cy=sm[i].y*SH|0; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ const k=((cy+dy)*SW+(cx+dx))*4; if(k<0||k>=im.length) continue; r0+=im[k]; g0+=im[k+1]; b0+=im[k+2]; n++; } }
        if(n){ const t=[r0/n/255,g0/n/255,b0/n/255]; for(let k=0;k<3;k++) skin[k]+=(t[k]-skin[k])*.15; } }
    }
  }catch(e){ console.warn(e); }
  segBusy=false;
}
function scalpFrom(w,h){
  const P=i=>[sm[i].x*w,sm[i].y*h]; const L=P(234), R=P(454), T=P(10), B=P(152);
  const W=Math.hypot(R[0]-L[0],R[1]-L[1]), H=Math.hypot(B[0]-T[0],B[1]-T[1]);
  const up=[(T[0]-B[0])/H,(T[1]-B[1])/H], mid=[(L[0]+R[0])/2,(L[1]+R[1])/2];
  return [mid[0]+up[0]*.16*H, mid[1]+up[1]*.16*H, .6*W, .6*H, Math.atan2(R[1]-L[1],R[0]-L[0])];
}
function irisFrom(w,h){
  if(sm.length<478) return [[0,0,0,0],[0,0,0,0]];
  return [[468,469,471],[473,474,476]].map(([c,a,b])=>{ const cx=sm[c].x*w, cy=sm[c].y*h, r=Math.hypot((sm[a].x-sm[b].x)*w,(sm[a].y-sm[b].y)*h)/2;
    const lid=c===468?Math.hypot((sm[159].x-sm[145].x)*w,(sm[159].y-sm[145].y)*h):Math.hypot((sm[386].x-sm[374].x)*w,(sm[386].y-sm[374].y)*h);
    return [cx,cy,r*1.05,Math.min(1,Math.max(0,(lid/r-.5)/.6))]; });
}
function setU(p,w,h){
  const u=n=>gl.getUniformLocation(p,n);
  gl.uniform1i(u('uVideo'),0); gl.uniform1i(u('uHair'),1); gl.uniform1i(u('uFill'),2);
  gl.uniform1f(u('uMirror'),facing==='user'?1:0); gl.uniform2f(u('uRes'),w,h);
  const hm = raw||!segm||!cur.hair||!sm ? 0 : cur.hair==='buzz' ? 2 : 1;
  gl.uniform1i(u('uHairMode'),hm);
  if(Array.isArray(cur.hair)){ gl.uniform3fv(u('uHairCol'),cur.hair); gl.uniform2fv(u('uLift'),cur.lift); }
  if(hm===2&&scalp){ gl.uniform4f(u('uScalp'),scalp[0],scalp[1],scalp[2],scalp[3]); gl.uniform1f(u('uScalpRot'),scalp[4]); gl.uniform3fv(u('uSkin'),skin); }
  const ir=(!raw&&cur.iris&&sm)?irises:[[0,0,0,0],[0,0,0,0]];
  gl.uniform4fv(u('uIris[0]'),ir[0]); gl.uniform4fv(u('uIris[1]'),ir[1]); if(cur.iris) gl.uniform3fv(u('uIrisCol'),cur.iris);
}
let paintLift=[0,1], hasPaint=false;
function applyFilter(f){
  cur=f; paintStrip(); hasPaint=false;
  for(const t of [tA,tB,tC]) upCanvas(t,null);
  if(f.paint){ const p=PAINTS[f.paint](f.flag); upCanvas(tA,p.A); upCanvas(tB,p.B); upCanvas(tC,p.C); paintLift=p.lift||[0,1]; hasPaint=true; }
  if(f.hair) loadSeg();
}
function frame(){
  requestAnimationFrame(frame);
  if(V.readyState<2) return;
  const w=V.videoWidth, h=V.videoHeight; if(C.width!==w||C.height!==h){ C.width=w; C.height=h; }
  const now=performance.now();
  if(V.currentTime!==lastT){ lastT=V.currentTime;
    gl.bindTexture(gl.TEXTURE_2D,tVideo); gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,V);
    if(faceLM){ try{ const r=faceLM.detectForVideo(V,now); if(r.faceLandmarks.length){ smoothLM(r.faceLandmarks[0]); seen=now; } }catch(e){} }
    if(cur.hair && segm){ if(cur.hair!=='buzz' || (segN++%2===0)) runSeg(now+.1); }
    if(sm){ scalp=scalpFrom(w,h); irises=irisFrom(w,h); }
  }
  const face=sm && now-seen<400;
  gl.viewport(0,0,w,h);
  for(const [i,t] of [[0,tVideo],[1,tHair],[2,tFill]]){ gl.activeTexture(gl.TEXTURE0+i); gl.bindTexture(gl.TEXTURE_2D,t); }
  gl.useProgram(PF); setU(PF,w,h); gl.uniform1i(gl.getUniformLocation(PF,'uRaw'),raw?1:0);
  gl.bindVertexArray(vaoF); gl.drawArrays(gl.TRIANGLES,0,3);
  if(face && hasPaint && !raw){
    const pos=new Float32Array(468*2); for(let i=0;i<468;i++){ pos[i*2]=sm[i].x; pos[i*2+1]=sm[i].y; }
    gl.bindBuffer(gl.ARRAY_BUFFER,posBuf); gl.bufferSubData(gl.ARRAY_BUFFER,0,pos);
    gl.useProgram(PM); setU(PM,w,h);
    for(const [i,t] of [[3,tA],[4,tB],[5,tC]]){ gl.activeTexture(gl.TEXTURE0+i); gl.bindTexture(gl.TEXTURE_2D,t); }
    gl.uniform1i(gl.getUniformLocation(PM,'uA'),3); gl.uniform1i(gl.getUniformLocation(PM,'uB'),4); gl.uniform1i(gl.getUniformLocation(PM,'uC'),5);
    gl.uniform2fv(gl.getUniformLocation(PM,'uALift'),paintLift);
    gl.bindVertexArray(vaoM); gl.drawElements(gl.TRIANGLES,FACE_TRI.length,gl.UNSIGNED_SHORT,0);
  }
  gl.bindVertexArray(null);
  if(faceLM && !face && !segLoading) pill('Show your face to the camera'); else if(!segLoading && !recOn) pill('');
}

/* ================= UI ================= */
function pill(t){ const p=$('pill'); p.textContent=t; p.hidden=!t; p.classList.toggle('rec',t.startsWith('●')); }
function paintStrip(){ const s=$('strip'); if(!s.children.length){ for(const f of FILTERS){ const b=document.createElement('button'); b.className='fl'; b.dataset.id=f.id;
      b.innerHTML='<div class="dot"></div><span></span>'; b.querySelector('.dot').textContent=f.e; b.querySelector('span').textContent=f.n; b.onclick=()=>applyFilter(f); s.appendChild(b); } }
  for(const b of s.children) b.setAttribute('aria-pressed',b.dataset.id===cur.id); }
async function startCam(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}); V.srcObject=stream; await V.play(); sm=null; }
$('flipBtn').onclick=async()=>{ facing=facing==='user'?'environment':'user'; try{ await startCam(); }catch(e){} };
const hold=on=>{ raw=on; };
$('beforeBtn').addEventListener('pointerdown',()=>hold(true)); for(const ev of ['pointerup','pointerleave','pointercancel']) $('beforeBtn').addEventListener(ev,()=>hold(false));
C.addEventListener('pointerdown',()=>hold(true)); for(const ev of ['pointerup','pointerleave','pointercancel']) C.addEventListener(ev,()=>hold(false));
$('goBtn').onclick=async()=>{
  const st=$('status'); st.className=''; $('goBtn').disabled=true;
  if(!gl){ st.className='err'; st.textContent='Your browser does not support the 3D graphics this needs. Try Chrome.'; return; }
  try{ st.textContent='Opening camera…'; await startCam(); }catch(e){ $('goBtn').disabled=false; st.className='err'; st.textContent='Camera blocked. Allow the camera in your browser settings, then try again.'; return; }
  initGL(); $('start').hidden=true; $('top').hidden=false; $('dock').hidden=false; requestAnimationFrame(frame);
  pill('Loading face AI…');
  try{ await loadFace(); pill(''); applyFilter(cur); }catch(e){ pill('Could not load the face AI. Check your internet and reload.'); }
};
paintStrip();

/* recording + photo */
let rec=null, chunks=[], recStart=0, recTimer=null, recOn=false, mic=null; const MAX=15;
function pickType(){ for(const t of ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm']) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t)) return t; return ''; }
async function startRec(){
  const vs=C.captureStream(30); try{ if(!mic) mic=await navigator.mediaDevices.getUserMedia({audio:true}); mic.getAudioTracks().forEach(t=>vs.addTrack(t)); }catch(e){}
  const type=pickType(); chunks=[]; rec=new MediaRecorder(vs,type?{mimeType:type,videoBitsPerSecond:6e6}:{});
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{ const blob=new Blob(chunks,{type:rec.mimeType||type||'video/webm'}); result(blob,true); };
  rec.start(250); recStart=performance.now(); recOn=true; $('recBtn').classList.add('on');
  recTimer=setInterval(()=>{ const s=(performance.now()-recStart)/1000; pill(`● 0:${String(Math.floor(s)).padStart(2,'0')} / 0:${MAX}`); $('recRing').style.strokeDashoffset=264*(1-Math.min(1,s/MAX)); if(s>=MAX) stopRec(); },100);
}
function stopRec(){ if(!rec||rec.state==='inactive') return; clearInterval(recTimer); recOn=false; rec.stop(); $('recBtn').classList.remove('on'); $('recRing').style.strokeDashoffset=264; pill(''); }
$('recBtn').onclick=()=>{ if(recOn) stopRec(); else startRec(); };
$('photoBtn').onclick=()=>C.toBlob(b=>b&&result(b,false),'image/jpeg',.92);
function result(blob,isVid){
  const ext=isVid?(blob.type.includes('mp4')?'mp4':'webm'):'jpg', url=URL.createObjectURL(blob);
  $('clip').hidden=!isVid; $('shot').hidden=isVid; if(isVid){ $('clip').src=url; $('clip').play().catch(()=>{}); } else $('shot').src=url;
  $('saveBtn').href=url; $('saveBtn').download=`face-lab.${ext}`;
  const file=new File([blob],`face-lab.${ext}`,{type:blob.type}); const ok=navigator.canShare&&navigator.canShare({files:[file]});
  $('shareBtn').hidden=!ok; $('shareBtn').onclick=()=>navigator.share({files:[file]}).catch(()=>{});
  $('result').hidden=false;
}
$('againBtn').onclick=()=>{ $('clip').pause(); $('result').hidden=true; };
window.__fl={PAINTS,S,applyFilter,FILTERS};
</script>
